[advisories]
# Each ignore is declared debt with a card that removes it.
ignore = [
    # chrono is unmaintained, no fixed release; direct and through sqlx's
    # `chrono` feature. Moving both to `time` is MED-79.
    "RUSTSEC-2026-0543",
    # astral-tokio-tar is unmaintained, no fixed release; dev-only, through
    # testcontainers for the e2e tests, never in the binary. MED-80.
    "RUSTSEC-2026-0440",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"
